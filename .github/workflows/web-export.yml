name: Build and deploy web game
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  GODOT_VERSION: '4.3'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install official Godot and web templates
        shell: bash
        run: |
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 "$release/$editor" -o "$editor"
          curl --fail --location --retry 3 "$release/$templates" -o "$templates"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q "$editor" -d .toolchain
          unzip -q "$templates" 'templates/web*' -d .toolchain
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp .toolchain/templates/web* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import resources and export single-threaded game
        shell: bash
        run: |
          godot="$PWD/.toolchain/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # Bootstrap imports before validating scripts that preload imported assets.
          "$godot" --headless --path godot --editor --import > bootstrap.log 2>&1
          "$godot" --headless --path godot --editor --import 2>&1 | tee import.log
          mkdir -p build/web
          entry="game-${GITHUB_SHA:0:12}"
          "$godot" --headless --path godot --export-release Web "$PWD/build/web/$entry.html" 2>&1 | tee export.log
          mv "build/web/$entry.html" build/web/index.html
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' import.log export.log; then exit 1; fi
          test -s build/web/index.html
          test -s "build/web/$entry.pck"
          test -s "build/web/$entry.wasm"
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
